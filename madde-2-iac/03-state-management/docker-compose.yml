services:
  minio:
    image: minio/minio:latest
    container_name: minio-state-backend
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
